<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="CONNECT: Understand your feelings. Find your next small step." />
<title>CONNECT</title>
<style>
/*
  MindNest global styles.
  Colors and sizes are APPROXIMATIONS taken from the home-page screenshot.
  Replace the values in :root with exact tokens from your Figma file
  (colors, font family, radii) to match the Stitch design precisely.
*/
:root {
  /* Pastel palette: lavender, soft pink, mint, peach, cream */
  --bg: #fdf8f3;
  --surface: #ffffff;
  --surface-soft: #f5effc;
  --ink: #3b3550;
  --ink-soft: #6d6584;
  --primary: #8e7cf0;
  --primary-ink: #ffffff;
  --accent: #ece6ff;
  --pink: #f9d3e0;
  --mint: #d3f3e4;
  --peach: #ffe2cc;
  --cream: #fff8ef;
  --urgent: #d7262e;
  --urgent-ink: #ffffff;
  --border: #e4dcf3;
  --focus: #1f1b3a;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-pill: 999px;
  --shadow: 0 4px 16px rgba(42, 36, 64, 0.06);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
}

h1,
h2,
h3 {
  line-height: 1.25;
  margin: 0 0 0.5rem;
}

p {
  margin: 0 0 0.75rem;
}

a {
  color: var(--primary);
}

button,
a.btn {
  font: inherit;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  left: -999px;
  top: 0;
  background: var(--surface);
  padding: 0.5rem 1rem;
  z-index: 100;
}
.skip-link:focus {
  left: 1rem;
  top: 1rem;
}

/* ---------- Layout ---------- */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main {
  flex: 1;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.page {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.page-header h1 {
  font-size: 1.75rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 1.35rem;
  text-align: center;
}

.section-subtitle {
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.95rem;
}

.eyebrow {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary);
  font-weight: 600;
}

.muted {
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.disclaimer {
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.85rem;
}

/* ---------- Header / nav ---------- */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.site-header__inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  text-decoration: none;
  color: var(--ink);
  font-weight: 700;
  font-size: 1.1rem;
}

.brand__mark {
  color: var(--primary);
  font-size: 1.3rem;
}

.nav {
  display: flex;
  gap: 0.25rem;
  flex-wrap: wrap;
  margin-right: auto;
}

.nav__link {
  padding: 0.45rem 0.75rem;
  border-radius: var(--radius-pill);
  text-decoration: none;
  color: var(--ink-soft);
  font-size: 0.95rem;
}

.nav__link.is-active {
  background: var(--accent);
  color: var(--ink);
  font-weight: 600;
}

.nav__link--soon {
  opacity: 0.55;
  cursor: default;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: 44px;
  padding: 0.6rem 1.1rem;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  text-decoration: none;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.95rem;
}

.btn--primary {
  background: var(--primary);
  color: var(--primary-ink);
}

.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--border);
}

.btn--urgent {
  background: var(--urgent);
  color: var(--urgent-ink);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 700;
}

.btn--urgent-soft {
  background: #fdecec;
  color: #8a1116;
  border-color: #f5c2c4;
}

.btn--call {
  background: var(--urgent);
  color: var(--urgent-ink);
  width: 100%;
  font-size: 1.05rem;
}

.page-actions {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}

/* ---------- Home ---------- */
.hero {
  text-align: center;
  padding: 1rem 0 0;
}

.hero__title {
  font-size: 2.25rem;
}

.hero__text {
  max-width: 560px;
  margin: 0 auto;
  color: var(--ink-soft);
}

.emotion-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.emotion-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.75rem;
}

.emotion-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.2rem;
  text-align: left;
  padding: 0.9rem;
  min-height: 44px;
  background: var(--surface-soft);
  border: 2px solid transparent;
  border-radius: var(--radius-md);
  color: var(--ink);
  cursor: pointer;
}

.emotion-card.is-selected {
  border-color: var(--primary);
  background: var(--accent);
}

.emotion-card__icon {
  font-size: 1.3rem;
  color: var(--primary);
}

.emotion-card__label {
  font-weight: 600;
}

.emotion-card__hint {
  font-size: 0.85rem;
  color: var(--ink-soft);
}

.emotion-card__badge {
  position: absolute;
  top: 0.6rem;
  right: 0.6rem;
  font-size: 0.7rem;
  background: var(--primary);
  color: #fff;
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-pill);
}

.emotion-callout {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
  justify-content: space-between;
  background: var(--accent);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
}

.emotion-callout p {
  margin: 0;
}

.benefits {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.benefits__grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}

.benefit h3 {
  font-size: 1rem;
}

.benefit p {
  color: var(--ink-soft);
  font-size: 0.92rem;
  margin: 0;
}

.support-strip {
  text-align: center;
  background: #fdf3f3;
  border-color: #f2d2d3;
}

/* ---------- Activities ---------- */
.activity-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.activity-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  box-shadow: var(--shadow);
}

.activity-card__title {
  font-size: 1.1rem;
}

.activity-card__desc {
  color: var(--ink-soft);
  margin: 0;
}

.activity-card__meta {
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin: 0;
}

.activity-card__actions {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.4rem;
}

/* ---------- Urgent help ---------- */
.page--urgent {
  gap: 1.5rem;
}

.urgent-hero {
  text-align: center;
  background: #fdf3f3;
  border: 1px solid #f2d2d3;
  border-radius: var(--radius-lg);
  padding: 1.5rem 1rem;
}

.urgent-hero h1 {
  font-size: 1.75rem;
  color: #7a1015;
}

.urgent-disclaimer p {
  margin: 0;
  font-size: 0.92rem;
  color: var(--ink-soft);
}

.helpline-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.helpline-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  box-shadow: var(--shadow);
}

/* Visual hierarchy: mental health support is the primary card. */
.helpline-card--mental-health {
  border: 2px solid var(--primary);
}

.helpline-card__type {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  margin: 0;
}

.helpline-card__name {
  font-size: 1.1rem;
  margin: 0;
}

.helpline-card__number {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  margin: 0;
}

.helpline-card__purpose,
.helpline-card__avail {
  font-size: 0.92rem;
  color: var(--ink-soft);
  margin: 0;
}

.plain-list {
  padding-left: 1.2rem;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

/* ---------- Footer ---------- */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 1rem;
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.82rem;
  background: var(--surface);
}

.site-footer p {
  max-width: 760px;
  margin: 0 auto;
}

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  .benefits__grid,
  .activity-grid,
  .helpline-grid {
    grid-template-columns: 1fr;
  }

  .hero__title {
    font-size: 1.75rem;
  }

  .site-header__inner {
    gap: 0.5rem;
  }

  .nav {
    order: 3;
    width: 100%;
    margin-right: 0;
    overflow-x: auto;
    flex-wrap: nowrap;
  }

  .btn--urgent {
    margin-left: auto;
    font-size: 0.8rem;
    padding: 0.5rem 0.75rem;
  }
}

@media (max-width: 420px) {
  .emotion-grid {
    grid-template-columns: 1fr;
  }
}

/* Respect users who prefer less motion. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- Guided activities ---------- */
.activity-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.activity-body {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  align-items: center;
  text-align: center;
}

.activity-body > * {
  max-width: 560px;
}

.activity-body .stack,
.activity-body .field-label,
.activity-body .textarea,
.activity-body .step-list,
.activity-body .inline-form,
.activity-body .plain-list {
  width: 100%;
  text-align: left;
}

.progress-text {
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin: 0;
}

.big-number {
  font-size: 5rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}

.sense-title {
  font-size: 2rem;
  margin: 0;
}

.prompt-text {
  font-size: 1.25rem;
  margin: 0;
}

.field-label {
  font-weight: 600;
  margin: 0;
}

.input,
.textarea {
  width: 100%;
  font: inherit;
  padding: 0.7rem 0.9rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
}

.inline-form {
  display: flex;
  gap: 0.5rem;
  width: 100%;
}

.inline-form .input {
  flex: 1;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  width: 100%;
}

.form-error {
  color: #8a1116;
  font-weight: 600;
  margin: 0;
}

.form-success {
  color: #1d6b3a;
  font-weight: 600;
  margin: 0;
}

.step-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.step-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  background: var(--surface-soft);
  border-radius: var(--radius-md);
  padding: 0.6rem 0.8rem;
}

.step-item.is-done .step-text {
  text-decoration: line-through;
  color: var(--ink-soft);
}

.step-check {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
  min-width: 0;
}

.step-check input[type='checkbox'] {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.step-actions {
  display: flex;
  gap: 0.35rem;
}

.step-actions .btn {
  min-height: 36px;
  padding: 0.3rem 0.7rem;
}

/* Breathing circle: a 4s in / 6s out rhythm with no breath holds. */
.breath-circle {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, #cfc6fb 0%, var(--primary) 100%);
  transform: scale(0.7);
  transition: transform 4s ease-in-out;
  margin: 0.5rem auto;
}

.breath-circle.is-in {
  transform: scale(1);
  transition-duration: 4s;
}

.breath-circle.is-out {
  transform: scale(0.7);
  transition-duration: 6s;
}

.breath-circle.is-paused {
  transition: none;
}

.breath-label {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0;
}

/* Feedback */
.feedback {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.feedback-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.6rem;
}

.feedback-option {
  min-height: 44px;
  padding: 0.6rem 0.8rem;
  border-radius: var(--radius-md);
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.feedback-option.is-selected {
  border-color: var(--primary);
  background: var(--accent);
  font-weight: 600;
}

.feedback-response {
  background: var(--surface-soft);
  border-radius: var(--radius-md);
  padding: 0.8rem 1rem;
  margin: 0;
}

@media (max-width: 760px) {
  .feedback-options {
    grid-template-columns: 1fr;
  }

  .big-number {
    font-size: 4rem;
  }
}

/* Reduced motion: the breathing circle moves in steps, not smoothly. */
@media (prefers-reduced-motion: reduce) {
  .breath-circle {
    transition: none !important;
  }
}

/* CONNECT additions: pastel background, brand, mood, insights and relax screens.
   Loaded after global.css, so these rules take priority where they overlap. */

body {
  background: linear-gradient(165deg, #fdf8f3 0%, #f5effc 45%, #e9f8f0 100%) fixed;
  min-height: 100vh;
}

/* ---------- Brand ---------- */
.brand__name {
  font-weight: 800;
  letter-spacing: 0.12em;
  background: linear-gradient(90deg, #8e7cf0, #e98fb8, #f2a97e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand-banner {
  font-size: clamp(2.2rem, 7vw, 3.4rem);
  font-weight: 800;
  letter-spacing: 0.18em;
  margin: 0;
  background: linear-gradient(90deg, #8e7cf0, #e98fb8, #f2a97e, #8fd8b4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand-tagline {
  color: var(--ink-soft);
  margin: 0.25rem 0 0.5rem;
  font-size: 1.05rem;
}

/* Friendlier cards and buttons */
.card {
  border-radius: 24px;
  box-shadow: 0 8px 28px rgba(142, 124, 240, 0.12);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn--primary {
  background: linear-gradient(135deg, #8e7cf0, #b89cf5);
  box-shadow: 0 4px 12px rgba(142, 124, 240, 0.3);
}

.btn--primary:hover {
  filter: brightness(1.05);
  transform: translateY(-1px);
}

.btn--ghost:hover {
  background: var(--accent);
}

.btn--danger {
  background: #fde7ea;
  color: #8a1116;
  border-color: #f2b8be;
}

.card-title {
  font-size: 1.15rem;
  margin: 0;
}

.stack-lg {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

.small {
  font-size: 0.82rem;
}

.empty-state {
  text-align: center;
  background: linear-gradient(135deg, #fff1f6, #eef9f3);
}

.helped-badge {
  display: inline-block;
  align-self: flex-start;
  font-size: 0.75rem;
  font-weight: 600;
  background: var(--mint);
  color: #1d5c3f;
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
}

.rating-block {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  background: var(--cream);
  border-radius: 16px;
  padding: 0.9rem;
}

/* ---------- My Mood ---------- */
.chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.chip {
  min-height: 40px;
  padding: 0.45rem 0.9rem;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}

.chip.is-selected {
  background: linear-gradient(135deg, var(--pink), var(--peach));
  border-color: #e98fb8;
  font-weight: 600;
}

.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 180px;
  padding-top: 1.5rem;
  margin-top: 0.75rem;
  border-bottom: 1px dashed var(--border);
}

.bar-col {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  min-width: 0;
}

.bar {
  width: 100%;
  min-height: 2px;
  border-radius: 10px 10px 4px 4px;
  background: linear-gradient(180deg, #b9a9f8, #8e7cf0);
  transition: height 0.4s ease;
}

.bar-count,
.bar-label {
  font-size: 0.7rem;
  color: var(--ink-soft);
  min-height: 1em;
}

.filters {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 0.75rem;
}

.filter {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  font-size: 0.85rem;
  color: var(--ink-soft);
}

.filter select {
  font: inherit;
  padding: 0.5rem 0.7rem;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
}

.history-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.history-item {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  background: var(--surface-soft);
  border-radius: 16px;
  padding: 0.75rem 0.9rem;
}

.history-emotion {
  font-weight: 600;
  margin: 0;
}

.history-note {
  margin: 0.25rem 0 0;
  font-style: italic;
  color: var(--ink-soft);
}

.history-actions {
  display: flex;
  gap: 0.4rem;
  align-items: flex-start;
  flex-wrap: wrap;
}

.danger-zone {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

/* ---------- Insights ---------- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.stat {
  text-align: center;
  background: linear-gradient(135deg, var(--mint), #e9f8f0);
}

.stat-number {
  font-size: 2.2rem;
  font-weight: 800;
  margin: 0;
  color: #2b7356;
}

.count-list {
  list-style: none;
  padding: 0;
  margin: 0.5rem 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.count-list li {
  display: grid;

// ---- utils/storage ----
const M_utils_storage = (() => {
// Small localStorage helpers. localStorage is NOT encrypted secure storage;
// clearing browser data removes everything stored here.

const STORAGE_KEYS = {
  savedActivities: 'mindnest.savedActivities',
  moodEntries: 'mindnest.moodEntries',
  settings: 'mindnest.settings',
  trustedContact: 'mindnest.trustedContact',
  journal: 'mindnest.journal',
  ratings: 'mindnest.ratings',
};

function loadJSON(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch {
    // Corrupt or unavailable storage: fall back safely instead of crashing.
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

return { STORAGE_KEYS, loadJSON, saveJSON };
})();

// ---- utils/ratings ----
const M_utils_ratings = (() => {
const { loadJSON, saveJSON, STORAGE_KEYS } = M_utils_storage;

// Stores whether each activity helped, as the person reports it.
// Shape: { [activityId]: { helped: number, notHelped: number } }

function loadRatings() {
  const r = loadJSON(STORAGE_KEYS.ratings, {});
  return r && typeof r === 'object' && !Array.isArray(r) ? r : {};
}

function recordRating(activityId, helped) {
  const ratings = loadRatings();
  const current = ratings[activityId] || { helped: 0, notHelped: 0 };
  ratings[activityId] = {
    helped: current.helped + (helped ? 1 : 0),
    notHelped: current.notHelped + (helped ? 0 : 1),
  };
  saveJSON(STORAGE_KEYS.ratings, ratings);
  return ratings;
}

function helpfulScore(ratings, activityId) {
  const r = ratings[activityId];
  return r ? r.helped - r.notHelped : 0;
}

return { loadRatings, recordRating, helpfulScore };
})();

// ---- utils/recommendations ----
const M_utils_recommendations = (() => {
const { ACTIVITIES } = M_data_activities;
const { loadRatings, helpfulScore } = M_utils_ratings;

// Rule-based recommendations. Each emotion maps to an ordered list of activity
// ids. No AI is involved. The first items are shown first.
const RULES = {
  stressed: ['breathing', 'counting', 'journaling', 'movement'],
  anxious: ['grounding', 'breathing', 'taskBreakdown', 'counting'],
  sad: ['journaling', 'creative', 'positive', 'trustedContact'],
  angry: ['restBreak', 'breathing', 'journaling', 'movement'],
  overwhelmed: ['taskBreakdown', 'restBreak', 'focusSession', 'counting'],
  exhausted: ['restBreak', 'movement', 'grounding', 'breathing'],
  numb: ['grounding', 'creative', 'movement', 'trustedContact'],
  happy: ['positive', 'journaling', 'creative', 'focusSession'],
  calm: ['positive', 'journaling', 'creative', 'focusSession'],
  motivated: ['taskBreakdown', 'focusSession', 'positive', 'journaling'],
};

/**
 * Returns the activities for an emotion, skipping any ids in `exclude`.
 * Used for "Show different activities" and skip options.
 */
// Activities the person found helpful move up. Ties keep the rule order.
function getActivitiesForEmotion(emotionId, exclude = []) {
  const ratings = loadRatings();
  const ids = RULES[emotionId] ?? [];
  return ids
    .map((id, index) => ({ activity: ACTIVITIES[id], index }))
    .filter(({ activity }) => activity && !exclude.includes(activity.id))
    .sort(
      (a, b) =>
        helpfulScore(ratings, b.activity.id) - helpfulScore(ratings, a.activity.id) || a.index - b.index
    )
    .map(({ activity }) => activity);
}

/**
 * Returns the next batch of activities after the ones already shown.
 * If everything has been shown, it cycles back to the start.
 */
function getDifferentActivities(emotionId, shownIds = []) {
  const all = getActivitiesForEmotion(emotionId);
  const fresh = all.filter((a) => !shownIds.includes(a.id));
  return fresh.length > 0 ? fresh : all;
}

return { getActivitiesForEmotion, getDifferentActivities };
})();

// ---- pages/Recommendations ----
const M_pages_Recommendations = (() => {


const ActivityCard = M_components_ActivityCard.default;
const { getEmotion, EMOTIONS } = M_data_emotions;
const { getActivitiesForEmotion, getDifferentActivities } = M_utils_recommendations;
const { loadJSON, saveJSON, STORAGE_KEYS } = M_utils_storage;
const { loadRatings } = M_utils_ratings;

function Recommendations() {
  const { emotionId } = useParams();
  const navigate = useNavigate();
  const emotion = getEmotion(emotionId);

  // Activities currently shown, and which have been shown (for "show different").
  const [shown, setShown] = useState(() =>
    emotion ? getActivitiesForEmotion(emotion.id) : []
  );
  const [shownIds, setShownIds] = useState(() => shown.map((a) => a.id));
  const [savedIds, setSavedIds] = useState(() => loadJSON(STORAGE_KEYS.savedActivities, []));

  if (!emotion) {
    return (
      <div className="page">
        <div className="card">
          <h1>We couldn't find that feeling.</h1>
          <p>Choose one from the list to see activities.</p>
          <Link to="/" className="btn btn--primary">Back to emotion selection</Link>
        </div>
      </div>
    );
  }

  function toggleSave(activityId) {
    const next = savedIds.includes(activityId)
      ? savedIds.filter((id) => id !== activityId)
      : [...savedIds, activityId];
    setSavedIds(next);
    saveJSON(STORAGE_KEYS.savedActivities, next);
  }

  function showDifferent() {
    const next = getDifferentActivities(emotion.id, shownIds);
    setShown(next);
    setShownIds((prev) => [...new Set([...prev, ...next.map((a) => a.id)])]);
  }

  return (
    <div className="page">
      <nav className="breadcrumb" aria-label="Breadcrumb">
        <button type="button" className="btn btn--ghost" onClick={() => navigate(-1)}>
          ← Back
        </button>
      </nav>

      <header className="page-header">
        <p className="eyebrow">Feeling {emotion.label.toLowerCase()}</p>
        <h1>Gentle activities for right now</h1>
        <p className="section-subtitle">
          These are suggestions, not instructions. Pick one, change it, or skip them all.
        </p>
      </header>

      <div className="activity-grid">
        {shown.map((activity) => (
          <ActivityCard
            key={activity.id}
            activity={activity}
            emotionId={emotion.id}
            helpedBefore={(loadRatings()[activity.id]?.helped ?? 0) > 0}
            saved={savedIds.includes(activity.id)}
            onToggleSave={toggleSave}
          />
        ))}
      </div>

      <div className="page-actions">
        <button type="button" className="btn btn--ghost" onClick={showDifferent}>
          Show different activities
        </button>
        <Link to="/" className="btn btn--ghost">Choose another emotion</Link>
        <Link to="/urgent-help" className="btn btn--urgent-soft">I need urgent help</Link>
      </div>

      <p className="muted">
        Feeling like none of these fit? You can choose another emotion any time. Nothing here is required.
      </p>

      {/* Hidden helper for screen readers: list of all emotions is on the home page. */}
      <span className="sr-only">{EMOTIONS.length} emotion options are available on the home page.</span>
    </div>
  );
}

return { default: Recommendations, Recommendations };
})();

const M_components_activities_BreathingActivity = (() => {


// Gentle breathing: 4 seconds in, 6 seconds out. No breath holds.
// The circle animation is turned off by the reduced-motion setting in CSS.
const IN_MS = 4000;
const OUT_MS = 6000;

function BreathingActivity({ onFinish }) {
  const [phase, setPhase] = useState('in');
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (paused) return undefined;
    const timer = setTimeout(
      () => setPhase((p) => (p === 'in' ? 'out' : 'in')),
      phase === 'in' ? IN_MS : OUT_MS
    );
    return () => clearTimeout(timer);
  }, [phase, paused]);

  return (
    <section className="activity-body" aria-label="Guided breathing">
      <div
        className={`breath-circle is-${phase}${paused ? ' is-paused' : ''}`}
        aria-hidden="true"
      />
      <p className="breath-label" aria-live="polite">
        {paused ? 'Paused. Breathe however feels comfortable.' : phase === 'in' ? 'Breathe in gently' : 'Breathe out slowly'}
      </p>
      <p className="muted">Breathe at a pace that feels comfortable. You can stop anytime.</p>
      <div className="page-actions">
        <button type="button" className="btn btn--ghost" onClick={() => setPaused((p) => !p)}>
          {paused ? 'Resume' : 'Pause'}
        </button>
        <button type="button" className="btn btn--primary" onClick={onFinish}>
          Finish
        </button>
      </div>
    </section>
  );
}

return { default: BreathingActivity, BreathingActivity };
})();

const M_components_activities_JournalActivity = (() => {

const { JOURNAL_PROMPT } = M_data_activityContent;
const { loadJSON, saveJSON, STORAGE_KEYS } = M_utils_storage;

// Writing area. Entries are saved ONLY when the user taps Save entry,
// and only in this browser's localStorage.
function JournalActivity({ onFinish }) {
  const [text, setText] = useState('');
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState('');

  function handleSave() {
    if (!text.trim()) {
      setError('Write a few words first, or choose "Continue without saving".');
      return;
    }
    const entries = loadJSON(STORAGE_KEYS.journal, []);
    const ok = saveJSON(STORAGE_KEYS.journal, [
      ...entries,
      { id: Date.now().toString(), text: text.trim(), createdAt: new Date().toISOString() },
    ]);
    if (!ok) {
      setError('This entry could not be saved in your browser. You can copy it somewhere safe.');
      return;
    }
    setError('');
    setSaved(true);
  }

  return (
    <section className="activity-body" aria-label="Journaling">
      <label htmlFor="journal-text" className="field-label">{JOURNAL_PROMPT}</label>
      <textarea
        id="journal-text"
        className="textarea"
        rows={7}
        value={text}
        onChange={(e) => {
          setText(e.target.value);
          setSaved(false);
        }}
        aria-describedby="journal-note"
      />
      <p id="journal-note" className="muted">
        Saving stores this entry only in this browser, on this device. It is not sent anywhere. Clearing your
        browser data will remove it.
      </p>
      {error && <p className="form-error" role="alert">{error}</p>}
      {saved && <p className="form-success" role="status">Saved on this device.</p>}

      <div className="page-actions">
        <button type="button" className="btn btn--primary" onClick={handleSave}>
          Save entry
        </button>
        <button type="button" className="btn btn--ghost" onClick={() => { setText(''); setSaved(false); setError(''); }}>
          Clear text
        </button>
        <button type="button" className="btn btn--ghost" onClick={onFinish}>
          Continue without saving
        </button>
      </div>
      {saved && (
        <div className="page-actions">
          <button type="button" className="btn btn--primary" onClick={onFinish}>
            Finish
          </button>
        </div>
      )}
    </section>
  );
}

return { default: JournalActivity, JournalActivity };
})();

// ---- components/activities/TaskBreakdownActivity ----
const M_components_activities_TaskBreakdownActivity = (() => {


// Break one task into small steps. Works fully without AI.
// Steps live in this screen's memory only; they are cleared when you leave.
let nextId = 1;
const newStep = (text) => ({ id: nextId++, text, done: false });

function TaskBreakdownActivity({ onFinish }) {
  const [task, setTask] = useState('');
  const [taskSet, setTaskSet] = useState(false);
  const [steps, setSteps] = useState([]);
  const [draft, setDraft] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');

  const doneCount = steps.filter((s) => s.done).length;

  function startWithTask(e) {
    e.preventDefault();
    if (!task.trim()) return;
    setTaskSet(true);
  }

  function addStep(e) {
    e.preventDefault();
    if (!draft.trim()) return;
    setSteps([...steps, newStep(draft.trim())]);
    setDraft('');
  }

  function toggleDone(id) {
    setSteps(steps.map((s) => (s.id === id ? { ...s, done: !s.done } : s)));
  }

  function removeStep(id) {
    setSteps(steps.filter((s) => s.id !== id));
    if (editingId === id) setEditingId(null);
  }

  function saveEdit(id) {
    if (!editText.trim()) return;
    setSteps(steps.map((s) => (s.id === id ? { ...s, text: editText.trim() } : s)));
    setEditingId(null);
  }

  if (!taskSet) {
    return (
      <section className="activity-body" aria-label="Task breakdown">
        <form onSubmit={startWithTask} className="stack">
          <label htmlFor="task-input" className="field-label">What task feels like a lot right now?</label>
          <input
            id="task-input"
            className="input"
            value={task}
            onChange={(e) => setTask(e.target.value)}
            placeholder="For example: Prepare for my presentation"
          />
          <div className="page-actions">
            <button type="submit" className="btn btn--primary" disabled={!task.trim()}>
              Break it down
            </button>
          </div>
        </form>
      </section>
    );
  }

  return (
    <section className="activity-body" aria-label="Task breakdown">
      <p className="field-label">Task: {task}</p>
      <p className="muted">
        Add small steps. Pick the first one and ignore the rest for now. {steps.length > 0 && `${doneCount} of ${steps.length} done.`}
      </p>

      <form onSubmit={addStep} className="inline-form">
        <label htmlFor="step-input" className="sr-only">Add a step</label>
        <input
          id="step-input"
          className="input"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="Add a small step"
        />
        <button type="submit" className="btn btn--primary" disabled={!draft.trim()}>Add step</button>
      </form>

      {steps.length === 0 && <p className="muted">No steps yet. Start with the smallest thing you can do.</p>}

      <ul className="step-list">
        {steps.map((s) => (
          <li key={s.id} className={`step-item${s.done ? ' is-done' : ''}`}>
            <label className="step-check">
              <input type="checkbox" checked={s.done} onChange={() => toggleDone(s.id)} />
              {editingId === s.id ? (
                <input
                  className="input"
                  aria-label="Edit step"
                  value={editText}
                  onChange={(e) => setEditText(e.target.value)}
                />
              ) : (
                <span className="step-text">{s.text}</span>
              )}
            </label>
            <div className="step-actions">
              {editingId === s.id ? (
                <button type="button" className="btn btn--ghost" onClick={() => saveEdit(s.id)}>Save</button>
              ) : (
                <button
                  type="button"
                  className="btn btn--ghost"
                  onClick={() => { setEditingId(s.id); setEditText(s.text); }}
                >
                  Edit
                </button>
              )}
              <button type="button" className="btn btn--ghost" onClick={() => removeStep(s.id)}>Delete</button>
            </div>
          </li>
        ))}
      </ul>

      <div className="page-actions">
        <button type="button" className="btn btn--primary" onClick={onFinish}>Finish</button>
      </div>
    </section>
  );
}

return { default: TaskBreakdownActivity, TaskBreakdownActivity };
})();

// ---- utils/moods ----
const M_utils_moods = (() => {
const { loadJSON, saveJSON, STORAGE_KEYS } = M_utils_storage;
const { getEmotion } = M_data_emotions;

// All mood check-ins live in this browser's localStorage. Nothing is invented:
// every number shown in the app is counted from entries the person saved.

function loadEntries() {
  const list = loadJSON(STORAGE_KEYS.moodEntries, []);
  return Array.isArray(list) ? list : [];
}

function addEntry(emotionId, note) {
  const entries = loadEntries();
  const entry = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    emotionId,
    note: (note || '').trim(),
    createdAt: new Date().toISOString(),
  };
  saveJSON(STORAGE_KEYS.moodEntries, [entry, ...entries]);
  return entry;
}

function deleteEntry(id) {
  saveJSON(
    STORAGE_KEYS.moodEntries,
    loadEntries().filter((e) => e.id !== id)
  );
}

function clearEntries() {
  saveJSON(STORAGE_KEYS.moodEntries, []);
}

// days: 'all' | '7' | '30'
function filterEntries(entries, { emotionId = 'all', days = 'all' } = {}) {
  const cutoff = days === 'all' ? 0 : Date.now() - Number(days) * 86400000;
  return entries.filter(
    (e) =>
      (emotionId === 'all' || e.emotionId === emotionId) &&
      new Date(e.createdAt).getTime() >= cutoff
  );
}

// Returns [{ id, emotion, count }] sorted from most to least frequent.
function countByEmotion(entries) {
  const counts = {};
  entries.forEach((e) => {
    counts[e.emotionId] = (counts[e.emotionId] || 0) + 1;
  });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([id, count]) => ({ id, emotion: getEmotion(id), count }))
    .filter((x) => x.emotion);
}

// Check-ins per day for the last `days` days, oldest first.
function dailyCounts(entries, days = 14) {
  const out = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = days - 1; i >= 0; i--) {
    const start = new Date(today);
    start.setDate(today.getDate() - i);
    const end = new Date(start);
    end.setDate(start.getDate() + 1);
    const count = entries.filter((e) => {
      const t = new Date(e.createdAt).getTime();
      return t >= start.getTime() && t < end.getTime();
    }).length;
    out.push({ label: start.getDate(), count });
  }
  return out;
}

function formatDateTime(iso) {
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

return { loadEntries, addEntry, deleteEntry, clearEntries, filterEntries, countByEmotion, dailyCounts, formatDateTime };
})();

const M_components_fun_BreathingBubble = (() => {


// A bubble that grows as you breathe in and softens as you breathe out.
// 4 seconds in, 6 seconds out. No breath holds.
const IN_MS = 4000;
const OUT_MS = 6000;

function BreathingBubble() {
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState('in');

  useEffect(() => {
    if (!running) return undefined;
    const timer = setTimeout(
      () => setPhase((p) => (p === 'in' ? 'out' : 'in')),
      phase === 'in' ? IN_MS : OUT_MS

    return () => clearTimeout(timer);
  }, [running, phase]);

  const label = !running
    ? 'Press start when you are ready.'
    : phase === 'in'
      ? 'Breathe in... the bubble grows.'
      : 'Breathe out... the bubble softens.';

  return (
    <div className="fun-panel">
      <div className={`bubble bubble--${phase}${running ? '' : ' is-idle'}`} aria-hidden="true" />
      <p className="fun-label" aria-live="polite">{label}</p>
      <button type="button" className="btn btn--primary" onClick={() => setRunning((r) => !r)}>
        {running ? 'Pause' : 'Start'}
      </button>
    </div>
  );
}

return { default: BreathingBubble, BreathingBubble };
})();

// ---- components/games/MoodMatch ----
const M_components_games_MoodMatch = (() => {


// Match a feeling word to its emoji. There are no wrong feelings here.
const FEELINGS = [
  { word: 'Calm', emoji: '😌' },
  { word: 'Happy', emoji: '😊' },
  { word: 'Tired', emoji: '😴' },
  { word: 'Anxious', emoji: '😟' },
  { word: 'Sad', emoji: '😢' },
];
const ROUNDS = 5;

function pickRound(prev) {
  const target = FEELINGS[Math.floor(Math.random() * FEELINGS.length)];
  const others = FEELINGS.filter((f) => f.word !== target.word).sort(() => Math.random() - 0.5).slice(0, 2);
  const options = [target, ...others].sort(() => Math.random() - 0.5);
  return prev && prev.target.word === target.word ? pickRound(prev) : { target, options };
}

function MoodMatch() {
  const [round, setRound] = useState(() => pickRound(null));
  const [count, setCount] = useState(1);
  const [picked, setPicked] = useState(null);
  const finished = count > ROUNDS;
  const correct = useMemo(() => picked && picked.word === round.target.word, [picked, round]);

  function next() {
    setRound((r) => pickRound(r));
    setCount((c) => c + 1);
    setPicked(null);
  }

  if (finished) {
    return (
      <div className="fun-panel">
        <p className="fun-label">You explored {ROUNDS} feelings. Every one of them is worth noticing.</p>
        <button type="button" className="btn btn--primary" onClick={() => { setCount(1); setPicked(null); }}>
          Play again
        </button>
      </div>
    );
  }

  return (
    <div className="fun-panel">
      <p className="progress-text">Round {count} of {ROUNDS}</p>
      <p className="fun-label">Which face matches <strong>{round.target.word}</strong>?</p>
      <div className="match-options">
        {round.options.map((o) => (
          <button
            key={o.word + o.emoji}
            type="button"
            className={`match-option${picked && picked.word === o.word ? ' is-picked' : ''}`}
            onClick={() => setPicked(o)}
            disabled={!!picked}
            aria-label={`${o.word} face`}
          >
            {o.emoji}
          </button>
        ))}
      </div>
      {picked && (
        <>
          <p className="fun-label" role="status">
            {correct ? 'Nice match!' : 'Not quite, and that’s fine. Feelings can be hard to name.'}
          </p>
          <button type="button" className="btn btn--primary" onClick={next}>Next</button>
        </>
      )}
    </div>
  );
}

return { default: MoodMatch, MoodMatch };
})();

const M_components_games_TapRelease = (() => {

const BreathingBubble = M_components_fun_BreathingBubble.default;

// Tap to release. Each tap sends out a burst of sparks. After enough taps,
// a calming breathing bubble appears so the game ends on something slower.
const TARGET = 15;

function TapRelease() {
  const [taps, setTaps] = useState(0);
  const [sparks, setSparks] = useState([]);
  const done = taps >= TARGET;

  function release() {
    const id = Date.now() + Math.random();
    const burst = Array.from({ length: 8 }, (_, i) => ({
      id: `${id}-${i}`,
      angle: (i / 8) * Math.PI * 2,
      color: ['#f9d3e0', '#ffe2cc', '#d9ccf7', '#fff1b8'][i % 4],
    }));
    setSparks((s) => [...s, { id, burst }]);
    setTaps((t) => t + 1);
    setTimeout(() => setSparks((s) => s.filter((x) => x.id !== id)), 700);
  }

  return (
    <div className="fun-panel">
      <p className="fun-label" aria-live="polite">
        {done
          ? 'Nice release. Let’s slow things down now.'
          : `Tap as many times as you like. ${taps} of ${TARGET} released.`}
      </p>
      {!done && (
        <div className="release-zone">
          <button type="button" className="release-button" onClick={release} aria-label="Release tension">
            Tap to release
          </button>
          {sparks.map((s) =>
            s.burst.map((p) => (
              <span
                key={p.id}
                className="spark"
                aria-hidden="true"
                style={{
                  background: p.color,
                  '--dx': `${Math.cos(p.angle) * 90}px`,
                  '--dy': `${Math.sin(p.angle) * 90}px`,
                }}
              />
            ))
          )}
        </div>
      )}
      {done && <BreathingBubble />}
    </div>
  );
}

return { default: TapRelease, TapRelease };
})();

const M_components_games_RestTimer = (() => {


// A countdown with start, pause and reset. Used for rest and five-minute challenges.
// Nothing is scored. The timer just counts down.
function RestTimer({ seconds = 180, prompts = ['Rest your eyes and breathe slowly.'], intro }) {
  const [left, setLeft] = useState(seconds);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    if (!running) return undefined;
    const id = setInterval(() => setLeft((l) => Math.max(0, l - 1)), 1000);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    if (left === 0) setRunning(false);
  }, [left]);

  const elapsed = seconds - left;
  const promptIndex = Math.min(Math.floor((elapsed / seconds) * prompts.length), prompts.length - 1);
  const mins = Math.floor(left / 60);
  const secs = String(left % 60).padStart(2, '0');

  return (
    <div className="fun-panel">
      <p className="fun-label">{intro}</p>
      <div className="timer" aria-live="polite">{mins}:{secs}</div>
      <div className="progress-track" aria-hidden="true">
        <div className="progress-fill" style={{ width: `${(elapsed / seconds) * 100}%` }} />
      </div>
      <p className="fun-label">
        {left === 0 ? 'Time is up. Nothing needs to change right now.' : prompts[promptIndex]}
      </p>
      <div className="page-actions">
        {left === 0 ? null : running ? (
          <button type="button" className="btn btn--ghost" onClick={() => setRunning(false)}>Pause</button>
        ) : (
          <button type="button" className="btn btn--primary" onClick={() => setRunning(true)}>
            {elapsed > 0 ? 'Resume' : 'Start'}
          </button>
        )}
        <button
          type="button"
          className="btn btn--ghost"
          onClick={() => { setRunning(false); setLeft(seconds); }}
        >
          Reset
        </button>
      </div>
    </div>
  );
}

return { default: RestTimer, RestTimer };
})();

// Write down a happy memory. Saved only when you press Save, in this browser only.

// ---- components/games/GoalGame ----
const M_components_games_GoalGame = (() => {

const Confetti = M_components_games_Confetti.default;

// Add small goals, tap them when done. A celebration shows when all are complete.
let nextId = 1;

function GoalGame() {
  const [draft, setDraft] = useState('');
  const [goals, setGoals] = useState([]);
  const doneCount = goals.filter((g) => g.done).length;
  const allDone = goals.length > 0 && doneCount === goals.length;

  function add(e) {
    e.preventDefault();
    if (!draft.trim()) return;
    setGoals([...goals, { id: nextId++, text: draft.trim(), done: false }]);
    setDraft('');
  }

  function toggle(id) {
    setGoals(goals.map((g) => (g.id === id ? { ...g, done: !g.done } : g)));
  }

  return (
    <div className="fun-panel">
      <p className="fun-label">Add a small goal, then tap it when it's done.</p>
      <form onSubmit={add} className="inline-form">
        <label htmlFor="goal-input" className="sr-only">New goal</label>
        <input
          id="goal-input"
          className="input"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="For example: Reply to one message"
        />
        <button type="submit" className="btn btn--primary" disabled={!draft.trim()}>Add</button>
      </form>

      {goals.length > 0 && (
        <>
          <div className="progress-track" aria-hidden="true">
            <div className="progress-fill" style={{ width: `${(doneCount / goals.length) * 100}%` }} />
          </div>
          <p className="muted small">{doneCount} of {goals.length} done</p>
          <ul className="goal-list">
            {goals.map((g) => (
              <li key={g.id}>
                <button
                  type="button"
                  className={`goal-item${g.done ? ' is-done' : ''}`}
                  aria-pressed={g.done}
                  onClick={() => toggle(g.id)}
                >
                  <span aria-hidden="true">{g.done ? '✅' : '⬜'}</span> {g.text}
                </button>
              </li>
            ))}
          </ul>
        </>
      )}

      {allDone && (
        <>
          <p className="fun-label" role="status">All goals done. Nice work on finishing them.</p>
          <Confetti />
        </>
      )}
    </div>
  );
}

return { default: GoalGame, GoalGame };
})();

const M_pages_FeelExperience = (() => {


const { getEmotion } = M_data_emotions;
const { EXPERIENCES, EXPERIENCE_TITLES, MOOD_MESSAGES } = M_data_experiences;
const FeelingCheck = M_components_FeelingCheck.default;
const PopBubbles = M_components_fun_PopBubbles.default;
const BreathingBubble = M_components_fun_BreathingBubble.default;
const VirtualGarden = M_components_fun_VirtualGarden.default;
const ColorGame = M_components_fun_ColorGame.default;
const GroundingActivity = M_components_activities_GroundingActivity.default;
const MoodMatch = M_components_games_MoodMatch.default;
const KindWords = M_components_games_KindWords.default;
const TapRelease = M_components_games_TapRelease.default;
const OneStep = M_components_games_OneStep.default;
const RestTimer = M_components_games_RestTimer.default;
const FloatingShapes = M_components_games_FloatingShapes.default;
const SensoryExplore = M_components_games_SensoryExplore.default;
const Confetti = M_components_games_Confetti.default;
const HappyMemory = M_components_games_HappyMemory.default;
const GoalGame = M_components_games_GoalGame.default;

// Renders one game. `onDone` lets a game end the session when it finishes.
function renderGame(id, onDone) {
  switch (id) {
    case 'popBubbles': return <PopBubbles />;
    case 'breathingBubble': return <BreathingBubble />;
    case 'garden': return <VirtualGarden />;
    case 'colorGame': return <ColorGame />;
    case 'grounding': return <GroundingActivity onFinish={onDone} />;
    case 'moodMatch': return <MoodMatch />;
    case 'kindWords': return <KindWords />;
    case 'tapRelease': return <TapRelease />;
    case 'oneStep': return <OneStep />;
    case 'restTimer': return (
      <RestTimer
        seconds={180}
        intro="A three-minute rest. You can pause, reset, or stop any time."
        prompts={['Let your shoulders drop.', 'Breathe slowly, at your own pace.', 'Notice how the chair or floor supports you.', 'Rest a little longer if you like.']}
      />
    );
    case 'floatingShapes': return <FloatingShapes />;
    case 'sensory': return <SensoryExplore />;
    case 'confetti': return <Confetti />;
    case 'happyMemory': return <HappyMemory />;
    case 'fiveMinute': return (
      <RestTimer
        seconds={300}
        intro="A five-minute challenge. Pick one small thing and work on it, then pause when you like."
        prompts={['Choose one small thing to start.', 'Keep going at a comfortable pace.', 'Notice what you have already done.', 'Pause whenever you need to.']}
      />
    );
    case 'goalGame': return <GoalGame />;
    default: return <p>This activity isn't available.</p>;
  }
}

// Motion class for the big emoji, so each mood moves in its own way.
const EMOJI_MOTION = {
  stressed: 'wobble', anxious: 'tremble', sad: 'sway', angry: 'shake', overwhelmed: 'wobble',
  exhausted: 'sway', numb: 'fade', happy: 'bounce', calm: 'sway', motivated: 'bounce',
};

function FeelExperience() {
  const { emotionId } = useParams();
  const navigate = useNavigate();
  const emotion = getEmotion(emotionId);
  const experiences = EXPERIENCES[emotionId] ?? [];

  // 'intro' -> 'playing' -> 'feedback'
  const [stage, setStage] = useState('intro');
  const [index, setIndex] = useState(0);

  if (!emotion || experiences.length === 0) {
    return (
      <div className="page">
        <div className="card">
          <h1>We couldn't find that mood.</h1>
          <Link to="/" className="btn btn--primary">Back to my mood</Link>
        </div>
      </div>
    );
  }

  const current = experiences[index];
  const title = EXPERIENCE_TITLES[current];

  function nextExperience() {
    setIndex((i) => (i + 1) % experiences.length);
    setStage('playing');
  }

  return (
    <div className="page feel-page" style={{ '--tint': emotion.tint }}>
      <div className="page-actions">
        <button type="button" className="btn btn--ghost" onClick={() => navigate('/')}>← Back</button>
      </div>

      {stage === 'intro' && (
        <section className="feel-hero card">
          <div className={`feel-emoji feel-emoji--${EMOJI_MOTION[emotion.id]}`} aria-hidden="true">{emotion.emoji}</div>
          <p className="eyebrow">You chose {emotion.label.toLowerCase()}</p>
          <h1 className="feel-title">{emotion.label}</h1>
          <p className="feel-message">{MOOD_MESSAGES[emotion.id]}</p>
          <p className="fun-label">Want to try a little game to explore this feeling?</p>
          <div className="feel-buttons">
            <button type="button" className="btn btn--primary btn--big" onClick={() => setStage('playing')}>
              Let's Play 🎮
            </button>
            <button type="button" className="btn btn--ghost" onClick={nextExperience}>
              Try Another Activity 🌿
            </button>
            <button type="button" className="btn btn--ghost" onClick={() => navigate('/')}>
              Change My Mood
            </button>
          </div>
          <p className="muted small">
            You can skip any game and come back anytime. <Link to={`/activities/${emotion.id}`}>See all gentle activities</Link>
          </p>
        </section>
      )}

      {stage === 'playing' && (
        <>
          <section className="card feel-game">
            <div className="feel-game__head">
              <span className={`feel-emoji-small feel-emoji--${EMOJI_MOTION[emotion.id]}`} aria-hidden="true">{emotion.emoji}</span>
              <div>
                <p className="eyebrow">{title}</p>
                <p className="muted small">Explore this feeling at your own pace.</p>
              </div>
            </div>
            {renderGame(current, () => setStage('feedback'))}
          </section>
          <div className="page-actions">
            <button type="button" className="btn btn--primary" onClick={() => setStage('feedback')}>I'm done</button>

            <button type="button" className="btn btn--ghost" onClick={() => navigate('/')}>Return home</button>
          </div>
        </>
      )}

      {stage === 'feedback' && (
        <FeelingCheck

        />
      )}
    </div>
  );
}

return { default: FeelExperience, FeelExperience };
})();

const M_pages_MyMood = (() => {


const { EMOTIONS, getEmotion } = M_data_emotions;

  deleteEntry,

  filterEntries,
  dailyCounts,
  formatDateTime,
} = M_utils_moods;

  const [entries, setEntries] = useState(() => loadEntries());
  const [emotionId, setEmotionId] = useState(null);
  const [note, setNote] = useState('');
  const [message, setMessage] = useState('');
  const [filterEmotion, setFilterEmotion] = useState('all');
  const [filterDays, setFilterDays] = useState('all');

    () => filterEntries(entries, { emotionId: filterEmotion, days: filterDays }),

  );

    deleteEntry(id);
    setEntries(loadEntries());

            <button
              key={e.id}

        <label htmlFor="mood-note" className="field-label">Add a note (optional)</label>
        <textarea
          id="mood-note"
          className="textarea"
          rows={3}
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder="Anything you'd like to remember about this moment"
        />
        <div className="page-actions">
          <button type="button" className="btn btn--primary" onClick={save}>Save check-in</button>
        </div>
        {message && <p className="form-success" role="status">{message}</p>}

      {entries.length === 0 ? (
        <section className="card empty-state">
          <h2 className="card-title">Your space is ready whenever you want to check in.</h2>

        </section>

        <>
          <section className="card" aria-labelledby="chart-heading">
            <h2 id="chart-heading" className="card-title">Check-ins over the last 14 days</h2>
            <p className="muted">Each bar is the number of check-ins you saved that day.</p>

              {daily.map((d, i) => (
                <div key={i} className="bar-col">
                  <span className="bar-count">{d.count || ''}</span>
                  <div className="bar" style={{ height: `${(d.count / maxDaily) * 100}%` }} />
                  <span className="bar-label">{d.label}</span>
                </div>
              ))}
            </div>
          </section>

          <section className="card" aria-labelledby="history-heading">
            <h2 id="history-heading" className="card-title">History</h2>

                <span>Emotion</span>
                <select value={filterEmotion} onChange={(e) => setFilterEmotion(e.target.value)}>
                  <option value="all">All emotions</option>

                    <option key={e.id} value={e.id}>{e.label}</option>
                  ))}
                </select>
              </label>
              <label className="filter">
                <span>Date</span>
                <select value={filterDays} onChange={(e) => setFilterDays(e.target.value)}>

                {visible.map((e) => {
                  const emotion = getEmotion(e.emotionId);
                  return (
                    <li key={e.id} className="history-item">
                      <div>
                        <p className="history-emotion">{emotion ? emotion.label : 'Unknown'}</p>
                        <p className="muted small">{formatDateTime(e.createdAt)}</p>
                        {e.note && <p className="history-note">{e.note}</p>}

// ---- components/fun/Challenge60 ----
const M_components_fun_Challenge60 = (() => {


// A one-minute guided pause. Prompts change every 10 seconds.
// You can pause, restart, or stop at any time. Nothing is scored.
const TOTAL = 60;
const PROMPTS = [
  'Unclench your jaw and let your shoulders drop.',
  'Breathe in slowly through your nose.',
  'Look at something far away for a moment.',
  'Roll your wrists and stretch your fingers.',
  'Notice three sounds around you.',
  'Let one long breath out, all the way.',
];

function Challenge60() {
  const [left, setLeft] = useState(TOTAL);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (!running) return undefined;
    const id = setInterval(() => setLeft((l) => Math.max(0, l - 1)), 1000);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    if (running && left === 0) {
      setRunning(false);
      setDone(true);
    }
  }, [left, running]);

  const elapsed = TOTAL - left;
  const promptIndex = Math.min(Math.floor(elapsed / 10), PROMPTS.length - 1);

  function start() {
    if (done || left === 0) {
      setLeft(TOTAL);
      setDone(false);
    }
    setRunning(true);
  }

  return (
    <div className="fun-panel">
      <div className="timer" aria-live="polite" aria-label={`${left} seconds left`}>
        {left}
      </div>
      <div className="progress-track" aria-hidden="true">
        <div className="progress-fill" style={{ width: `${(elapsed / TOTAL) * 100}%` }} />
      </div>

      {done ? (
        <p className="fun-label">You finished the 60 seconds. Nothing needs to change right now.</p>
      ) : (
        <p className="fun-label">{running || elapsed > 0 ? PROMPTS[promptIndex] : 'One minute. Press start when you are ready.'}</p>
      )}

      <div className="page-actions">
        {running ? (
          <button type="button" className="btn btn--ghost" onClick={() => setRunning(false)}>Pause</button>
        ) : (
          <button type="button" className="btn btn--primary" onClick={start}>
            {elapsed > 0 && !done ? 'Resume' : 'Start'}
          </button>
        )}
        {elapsed > 0 && (
          <button
            type="button"
            className="btn btn--ghost"
            onClick={() => {
              setRunning(false);
              setLeft(TOTAL);
              setDone(false);
            }}
          >
            Restart
          </button>
        )}
      </div>
    </div>
  );
}

return { default: Challenge60, Challenge60 };
})();

// ---- pages/Relax ----
const M_pages_Relax = (() => {


const BreathingBubble = M_components_fun_BreathingBubble.default;
const PopBubbles = M_components_fun_PopBubbles.default;
const VirtualGarden = M_components_fun_VirtualGarden.default;
const ColorGame = M_components_fun_ColorGame.default;
const MoodFace = M_components_fun_MoodFace.default;
const Challenge60 = M_components_fun_Challenge60.default;

const TABS = [
  { id: 'breathing', label: 'Breathing bubble', Component: BreathingBubble },
  { id: 'pop', label: 'Pop the bubbles', Component: PopBubbles },
  { id: 'garden', label: 'Virtual garden', Component: VirtualGarden },
  { id: 'color', label: 'Colour game', Component: ColorGame },
  { id: 'face', label: 'Mood face', Component: MoodFace },
  { id: 'challenge', label: '60-second pause', Component: Challenge60 },
];

function Relax() {
  const [active, setActive] = useState('breathing');
  const current = TABS.find((t) => t.id === active) ?? TABS[0];
  const Active = current.Component;

  return (
    <div className="page">
      <header className="page-header">
        <p className="eyebrow">Take a small break</p>
        <h1>Relax</h1>
        <p className="section-subtitle">
          Little activities to play with when you need a moment. Nothing here is scored or required.
        </p>
      </header>

      <div className="tabs" role="tablist" aria-label="Relax activities">
        {TABS.map((t) => (
          <button
            key={t.id}
            type="button"
            role="tab"
            id={`tab-${t.id}`}
            aria-selected={active === t.id}
            aria-controls="relax-panel"
            className={`tab${active === t.id ? ' is-active' : ''}`}
            onClick={() => setActive(t.id)}
          >
            {t.label}
          </button>
        ))}
      </div>

      <section className="card relax-panel" id="relax-panel" role="tabpanel" aria-labelledby={`tab-${active}`}>
        <Active />
      </section>

      <p className="muted">
        Feeling heavy rather than playful?{' '}
        <Link to="/urgent-help">Get support or a helpline number</Link>.
      </p>
    </div>
  );
}

return { default: Relax, Relax };
})();
